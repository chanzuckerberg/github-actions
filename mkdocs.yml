site_name: chanzuckerberg/github-actions
site_description: Reusable GitHub Actions and workflows used across CZI.
site_url: https://chanzuckerberg.github.io/github-actions/
repo_url: https://github.com/chanzuckerberg/github-actions
repo_name: chanzuckerberg/github-actions
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Terragrunt Engine:
      - terragrunt-engine/index.md
      - Getting started: terragrunt-engine/getting-started.md
      - Bot commands: terragrunt-engine/bot-commands.md
      - Stack authority: terragrunt-engine/stack-authority.md
      - Inputs reference: terragrunt-engine/inputs.md
      - Troubleshooting: terragrunt-engine/troubleshooting.md
