name: Release please
description: >
  Drives the release-please library to create/update release PRs and GitHub
  releases with a single commit per release branch. When preserve_files is set,
  a custom ManifestPlugin folds the carried-forward values.yaml image tags into
  the same commit, eliminating the double-push that the old GITHUB_TOKEN + amend
  approach produced.
inputs:
  app_token:
    description: 'App token obtained using create-github-app-token'
    required: true
  include_component_in_tag:
    description: 'Deprecated: set include-component-in-tag in release-please-config.json instead. This input is accepted for backward compatibility but is not used; the config file is the source of truth.'
    required: false
    default: false
    deprecationMessage: 'Use include-component-in-tag in release-please-config.json instead. This input is ignored by the node24 JS action.'
  preserve_files:
    description: 'File paths or glob patterns to carry forward after release-please force-pushes the release branch. Accepts comma-separated, newline-separated, or a mix of both. Globs (e.g. */.infra/values.yaml) are expanded against the old branch tree. Only the exact changes the automation made (diff between the old branch and its base) are applied to the new branch, so unrelated edits in the same file are never touched.'
    required: false
    default: ''
  floating_tags:
    description: 'When true, publish/advance floating major and minor tags (vMAJOR / vMAJOR.MINOR for the root package, name-vMAJOR / name-vMAJOR.MINOR for components) for each release created. Defaults to false; enable this only for repos whose consumers pin to floating tag aliases.'
    required: false
    default: false
runs:
  using: node24
  main: dist/index.js
