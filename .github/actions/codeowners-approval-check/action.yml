name: 'CODEOWNERS Approval Check'
description: >
  Reports a commit status that is green only when every changed file matching a
  CODEOWNERS rule is authored by a code owner or has an APPROVED review from a
  code owner. Team owners (@org/team) are expanded to members via an org-scoped
  token. A single status (context below) is upserted per head SHA -- so it
  collapses to one latest-wins entry with a clean, stable name -- and the full
  "waiting on" + per-file breakdown is written to the Actions job summary,
  reachable from the status' Details link.
author: 'CZI'

inputs:
  github-token:
    description: >
      Token used to read PR files/reviews and to write the commit status. The
      calling workflow must grant `pull-requests: read` and `statuses: write`.
    required: false
    default: ${{ github.token }}
  org-token:
    description: >
      GitHub App installation token with organization Members:read. Used only to
      expand @org/team CODEOWNERS entries into their member logins.
    required: true
  org:
    description: 'Organization whose teams are expanded. Defaults to the repository owner.'
    required: false
    default: ${{ github.repository_owner }}
  codeowners-path:
    description: 'Path to the CODEOWNERS file within the repository.'
    required: false
    default: '.github/CODEOWNERS'
  status-context:
    description: >
      The commit status context (name) to publish. This is what a branch
      protection rule should require. Keep it stable so every run updates the
      same status.
    required: false
    default: 'codeowners-approval'
  dismiss_stale_approvals:
    description: >
      When true, only count an APPROVED review if it was submitted on the PR's
      current head SHA (approvals on earlier commits are ignored). When false,
      the latest APPROVED review counts regardless of commit.
    required: false
    default: 'false'

runs:
  using: 'node24'
  main: 'dist/index.js'

branding:
  icon: 'check-circle'
  color: 'green'
