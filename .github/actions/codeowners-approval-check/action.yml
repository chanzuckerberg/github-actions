name: 'CODEOWNERS Approval Check'
description: >
  Reports a Check Run that is green only when every changed file matching a
  CODEOWNERS rule is authored by a code owner or has an APPROVED review from a
  code owner. Team owners (@org/team) are expanded to members via an org-scoped
  token. A single check run is upserted per head SHA, so it flips in place
  across pull_request and pull_request_review events (no duplicate checks), and
  its Details panel shows a "waiting on" summary plus a per-file breakdown.
author: 'CZI'

inputs:
  github-token:
    description: >
      Token used to read PR files/reviews and to create/update the Check Run.
      The calling workflow must grant `pull-requests: read` and `checks: write`.
    required: false
    default: ${{ github.token }}
  org-token:
    description: >
      GitHub App installation token with organization Members:read. Used only to
      expand @org/team CODEOWNERS entries into their member logins.
    required: true
  org:
    description: 'Organization whose teams are expanded. Defaults to the repository owner.'
    required: false
    default: ${{ github.repository_owner }}
  codeowners-path:
    description: 'Path to the CODEOWNERS file within the repository.'
    required: false
    default: '.github/CODEOWNERS'
  check-name:
    description: >
      The Check Run name to publish. This is what a branch protection rule
      should require. Keep it stable so every run updates the same check.
    required: false
    default: 'codeowners-approval'
  dismiss_stale_approvals:
    description: >
      When true, only count an APPROVED review if it was submitted on the PR's
      current head SHA (approvals on earlier commits are ignored). When false,
      the latest APPROVED review counts regardless of commit.
    required: false
    default: 'false'

runs:
  using: 'node24'
  main: 'dist/index.js'

branding:
  icon: 'check-circle'
  color: 'green'
